<!DOCTYPE html>
<h:html lang="es" xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui">
    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sistema de Cuentas Bancarias</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css" />
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/primeone-dark.css" />
        <style>
            .custom-table {
                font-size: 14px !important;
            }
        </style>
    </h:head>
    <h:body>
        <div class="card">
            <h:form id="cuentas-form" action="">
                <p:growl id="mensajes" showDetail="true" />
                <div class="card">
                    <p:menubar>
                        <p:menuitem value="Inicio" icon="pi pi-fw pi-user" update=":cuentas-form:cuentas-tabla"
                                    actionListener="#{indexControlador.recuperarDatos}"/>
                        <p:menuitem value="Agregar" icon="pi pi-fw pi-plus" update=":modal-form:cuenta-ventana"
                                    actionListener="#{indexControlador.agregarCuenta}" oncomplete="PF('ventanaModalCuenta').show()"/>
                    </p:menubar>
                </div>
                <div class="card">
                    <p:dataTable value="#{indexControlador.cuentas}" var="cuenta"
                                 id="cuentas-tabla" widgetVar="cuentasTabla">
                        <f:facet name="header">
                            <div class="flex justify-content-center flex-wrap card-container yellow-container">
                                <div class="flex align-items-center justify-content-center 
                                            w-20rem h-4rem bg-yellow-500 font-bold
                                            text-gray-900 border-round m-2">
                                    <h2 style="font-size:20px !important">Sistema de Cuentas Bancarias</h2>
                                </div>
                            </div>
                        </f:facet>
                        <p:column headerText="Id">
                            <h:outputText value="#{cuenta.idCuenta}" />
                        </p:column>
                        <p:column headerText="Nombre">
                            <h:outputText value="#{cuenta.nombre}" />
                        </p:column>
                        <p:column headerText="Tipo de Cuenta">
                            <h:outputText value="#{cuenta.tipoCuenta.displayName}" />
                        </p:column>
                        <p:column headerText="Saldo">
                            <h:outputText value="#{cuenta.saldo}">
                                <f:convertNumber type="currency" currencySymbol="$" />
                            </h:outputText>
                        </p:column>
                    </p:dataTable>
                </div>
            </h:form>
        </div>
    </h:body>
</h:html>
